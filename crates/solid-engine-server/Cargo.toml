[package]
name = "solid-engine-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "solid_engine_server"

[[bin]]
name = "solid-engine-server"
path = "src/bin/main.rs"

[dependencies]
core_affinity = "0.8.3"
solid-engine-core = { path = "../solid-engine-core", version = "1.1.1", default-features = false }
solid-engine-protocol = { path = "../solid-engine-protocol", version = "1.1.1" }
solid-engine-storage = { path = "../solid-engine-storage", version = "1.1.1" }

[features]
default = ["split-done"]
dense-done = ["solid-engine-core/dense-done"]
slot64 = ["solid-engine-core/slot64"]
split-done = ["solid-engine-core/split-done"]
# Désactivées par défaut (validation et campagnes de mesure uniquement) ; elles activent la feature du même nom du stockage.
snapshot-fault-injection = ["solid-engine-storage/snapshot-fault-injection"]
wal-diagnostics = ["solid-engine-storage/wal-diagnostics"]

[[test]]
name = "snapshot_worker_faults"
required-features = ["snapshot-fault-injection"]

[[test]]
name = "kill_audit_load"
required-features = ["snapshot-fault-injection", "wal-diagnostics"]
