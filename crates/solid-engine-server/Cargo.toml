[package]
name = "solid-engine-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "solid_engine_server"

[[bin]]
name = "solid-engine-server"
path = "src/bin/main.rs"

[dependencies]
solid-engine-core = { path = "../solid-engine-core", version = "1.0.1", default-features = false }
solid-engine-protocol = { path = "../solid-engine-protocol", version = "1.0.1" }
solid-engine-storage = { path = "../solid-engine-storage", version = "1.0.1" }

[features]
default = ["split-done"]
dense-done = ["solid-engine-core/dense-done"]
slot64 = ["solid-engine-core/slot64"]
split-done = ["solid-engine-core/split-done"]
